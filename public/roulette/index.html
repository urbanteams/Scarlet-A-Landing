<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Russian Roulette</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='31'%20fill='%23B96F36'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='23'%20fill='%23F2A867'/%3E%3Ccircle%20cx='27'%20cy='27'%20r='9'%20fill='%23FFD2A1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═════ High Noon theme. Palette: plum ink, dusk purple, cream, sunset orange, terracotta. See docs/style.md ═════ */
  :root {
    --plum: #2A1422; --dusk: #2E1830; --dusk2: #1F1020; --cream: #FBF1DC; --cb: #d9c6a3;
    --sun: #F2A867; --terra: #C9482F; --rose: #d9c2b8; --red: #E5484D; --mint: #5FD3B0; --mintdk: #1F8F6F; --sand: #efe1c4;
    --k: 1; --pf: 16px; --rf: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
  body { font-family: 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cream); -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; border: 0; background: none; padding: 0; margin: 0; }
  button:disabled { cursor: default; }
  input { font: inherit; letter-spacing: inherit; text-transform: uppercase; outline: none; margin: 0; }
  svg.ico { width: 1.45em; height: 1.45em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ── backgrounds ── */
  #bg > div { position: fixed; inset: 0; }
  #bgDusk { background: radial-gradient(ellipse 90% 40% at 50% 100%, rgba(242,140,80,.4), transparent 70%), linear-gradient(#2E1830, #1F1020); }
  #bgSky { background: linear-gradient(#F8D9A0 0%, #F2A867 40%, #D96B4E 70%, #8E3A45 100%); overflow: hidden; opacity: 0; }
  body[data-screen=menu] #bgSky { opacity: 1; }
  body[data-screen=menu] #bgDusk { opacity: 0; }
  #bgSky .sun { position: absolute; right: 16.4vw; top: 26vh; width: 28.7vh; height: 28.7vh; border-radius: 50%; background: #FFF1CF; box-shadow: 0 0 90px 30px rgba(255,241,207,.5); }
  #bgSky .mesa { position: absolute; left: 0; bottom: 0; width: 100%; height: 41vh; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #app { position: fixed; inset: 0; pointer-events: none; }
  .scr { position: absolute; inset: 0; display: none; }
  .scr.on { display: block; }
  button, input, label, .card, .modal .mp, .chat, #logCard, #lobScroll { pointer-events: auto; }

  /* ── menu / title ── */
  .mhead { position: absolute; left: 5.6vw; top: 9vh; right: 5.6vw; }
  .mhead h1 { margin: 0; font: 400 min(8.1vw, 12.5vh)/.92 'Bevan', serif; letter-spacing: -.01em; color: var(--plum); }
  .mhead p { margin: 2.2vh 0 0 .4vw; font-size: clamp(13px, min(1.65vw, 2.9vh), 24px); letter-spacing: .14em; color: #4a2233; font-weight: 500; }
  .howp { position: absolute; right: 5.6vw; top: 9.5vh; height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--plum); display: flex; align-items: center; font-size: 15px; letter-spacing: .12em; color: var(--plum); font-weight: 500; }
  .howp:hover { background: rgba(42,20,34,.1); }
  .mbot { position: absolute; left: 5.6vw; right: 5.6vw; bottom: 6.5vh; }
  .rejrow { margin-bottom: 12px; }
  .rej { height: 40px; padding: 0 18px; border-radius: 999px; background: var(--plum); color: var(--cream); display: none; align-items: center; font-size: 14px; letter-spacing: .1em; font-weight: 500; box-shadow: 0 8px 20px rgba(30,10,20,.35); }
  .rej.on { display: inline-flex; }
  .strip { min-height: clamp(84px, 14vh, 150px); border-radius: 20px; background: var(--cream); display: flex; align-items: center; gap: 12px; padding: 0 clamp(14px, 1.6vw, 24px); box-shadow: 0 16px 40px rgba(30,10,20,.45); color: var(--plum); }
  .strip input { height: clamp(48px, 6.8vh, 68px); border-radius: 12px; border: 2px solid var(--cb); background: #fff; padding: 0 16px; color: var(--plum); min-width: 0; }
  .strip input:focus { border-color: var(--terra); }
  .strip .name { flex: 1 1 auto; font-size: clamp(20px, 3.6vh, 34px); font-weight: 600; letter-spacing: .07em; }
  .strip .name::placeholder, .strip .code::placeholder { color: #b9a78f; font-weight: 400; }
  .strip .code { width: 130px; text-align: center; letter-spacing: .3em; font-size: clamp(16px, 2.4vh, 22px); font-weight: 500; padding: 0 8px; }
  .strip button { height: clamp(48px, 6.8vh, 68px); padding: 0 24px; border-radius: 12px; border: 2px solid var(--plum); font-size: clamp(14px, 2vh, 18px); letter-spacing: .1em; white-space: nowrap; font-weight: 500; color: var(--plum); }
  .strip button:hover { background: rgba(42,20,34,.07); }
  .strip button.pri { background: var(--terra); border-color: var(--terra); color: #fff; }
  .strip button.pri:hover { background: #b23d26; }
  .strip .sep { width: 1px; height: clamp(48px, 6.8vh, 68px); background: var(--cb); margin: 0 6px; flex: none; }
  .joinrow { display: flex; gap: 12px; align-items: center; }
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .mhead { top: 9vh; }
    .mhead h1 { font-size: min(13vw, 9vh); }
    .mhead p { font-size: clamp(12px, 3.6vw, 20px); margin-top: 1.6vh; }
    .howp { top: 2.4vh; right: 5.6vw; height: 36px; font-size: 13px; padding: 0 16px; }
    #bgSky .sun { right: 8vw; top: 36vh; width: 34vw; height: 34vw; }
    #bgSky .mesa { height: 30vh; }
    .mbot { bottom: 3.5vh; }
    .strip { flex-direction: column; align-items: stretch; padding: 14px; gap: 10px; min-height: 0; }
    .strip .sep { display: none; }
    .strip input, .strip button { height: 48px; }
    .strip .name { flex: none; font-size: 22px; }
    .joinrow .code { flex: 1; width: auto; }
  }
  @media (max-width: 860px) and (max-height: 760px), (max-aspect-ratio: 1/1) and (max-height: 760px) {
    .strip { padding: 10px; gap: 7px; }
    .strip input, .strip button { height: 42px; }
    .strip .name { font-size: 20px; }
  }
  /* start-up sequence (first load only) */
  body.intro #bgSky { opacity: 0; }
  body.intro.i-bg #bgSky { opacity: 1; transition: opacity 1s ease; }
  body.intro .mhead h1, body.intro .mhead p { opacity: 0; transform: translateY(14px); }
  body.intro.i-title .mhead h1, body.intro.i-sub .mhead p { opacity: 1; transform: none; transition: opacity .7s ease, transform .7s ease; }
  body.intro .strip, body.intro .howp, body.intro .rej { opacity: 0; visibility: hidden; transform: translateY(14px); }
  body.intro.i-strip .strip, body.intro.i-pills .howp, body.intro.i-pills .rej { opacity: 1; visibility: visible; transform: none; transition: opacity .7s ease, transform .7s ease; }

  /* ── cream cards, buttons, pills ── */
  .card { background: var(--cream); color: var(--plum); border-radius: 1.15em; box-shadow: 0 .5em 1.5em rgba(0,0,0,.38); padding: .95em 1.1em; }
  .pill { height: 2.5em; padding: 0 1.2em; border-radius: 999px; border: 1px solid rgba(251,241,220,.3); background: rgba(46,24,48,.7); color: var(--rose); font-size: 14px; letter-spacing: .12em; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
  .pill:hover { background: rgba(61,34,56,.95); color: var(--cream); }
  .btn { height: 2.9em; padding: 0 1.6em; border-radius: .8em; border: 2px solid var(--plum); color: var(--plum); font-weight: 500; letter-spacing: .1em; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
  .btn.pri { background: var(--terra); border-color: var(--terra); color: #fff; }
  .btn:hover { background: rgba(42,20,34,.07); } .btn.pri:hover { background: #b23d26; }
  .btn:disabled { opacity: .4; }

  /* ── connecting ── */
  #sConn { display: none; align-items: center; justify-content: center; flex-direction: column; gap: 22px; }
  #sConn.on { display: flex; }
  #sConn .ct { font-size: clamp(20px, 4vw, 34px); font-weight: 500; letter-spacing: .14em; color: var(--cream); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .55; } }

  /* ── lobby ── */
  #lobScroll { position: absolute; inset: 0; overflow-y: auto; padding: max(7.5vh, 40px) 16px 28px; display: flex; flex-direction: column; align-items: center; }
  #lobScroll > * { flex: none; }
  .lkick { font-size: clamp(12px, 1.9vh, 16px); letter-spacing: .3em; color: var(--rose); }
  .lcode { font: 400 clamp(54px, 15vh, 120px)/1.05 'Bevan', serif; color: var(--cream); letter-spacing: .12em; margin: .1em 0 .25em .12em; text-shadow: 0 0 40px rgba(242,168,103,.35); }
  .lgrid { display: flex; gap: 18px; width: 100%; max-width: 860px; justify-content: center; align-items: flex-start; flex-wrap: wrap; font-size: clamp(14px, 2.1vh, 18px); }
  .lgrid .card { flex: 1 1 340px; max-width: 420px; padding: 1em 1.2em 1.1em; }
  .lgrid h3 { margin: 0 0 .6em; font-size: .9em; letter-spacing: .2em; color: var(--terra); font-weight: 600; }
  .prow { display: flex; align-items: center; gap: .8em; height: 2.3em; border-bottom: 1px solid #efe1c4; font-weight: 500; }
  .prow:last-child { border-bottom: 0; }
  .prow .n { width: 1.2em; color: #b9a78f; font-size: .85em; } .prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow.me .nm { color: var(--terra); } .prow.empty { color: #cdbda4; }
  .prow .tg { font-size: .72em; letter-spacing: .14em; color: #8E3A45; }
  .prow .x { width: 1.8em; height: 1.8em; border-radius: 50%; border: 1px solid var(--cb); font-size: .8em; color: #8E3A45; display: grid; place-items: center; pointer-events: auto; }
  .orow { display: flex; align-items: center; justify-content: space-between; height: 3em; font-weight: 500; }
  .orow .lbl { font-size: .9em; letter-spacing: .1em; }
  .step { display: flex; align-items: center; gap: .4em; }
  .step button { width: 2.2em; height: 2.2em; border-radius: 50%; border: 2px solid var(--plum); font-size: 1em; font-weight: 600; display: grid; place-items: center; line-height: 1; }
  .step button:hover { background: rgba(42,20,34,.08); }
  .step .num { min-width: 2.6em; height: 2.2em; border-radius: .6em; border: 2px solid var(--cb); background: #fff; font-weight: 600; font-size: 1em; }
  .tgl { height: 2.2em; min-width: 4.2em; border-radius: 999px; border: 2px solid var(--plum); font-weight: 600; font-size: .9em; }
  .tgl.on { background: var(--plum); color: var(--cream); }
  .lval { font-weight: 600; font-size: 1.1em; }
  .lwait { margin: 1.4em 0 .9em; font-size: clamp(13px, 2vh, 17px); letter-spacing: .16em; color: var(--rose); animation: blink 1.6s ease-in-out infinite; }
  .lbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .lbtns .btn { border-color: rgba(251,241,220,.5); color: var(--cream); }
  .lbtns .btn:hover { background: rgba(251,241,220,.1); }
  .lbtns .btn.pri { background: var(--terra); border-color: var(--terra); color: #fff; }
  .lbtns .btn { flex-direction: column; line-height: 1.1; }
  .lbtns small { display: block; font-size: .62em; letter-spacing: .14em; opacity: .85; margin-top: .1em; }

  /* ── table: wide layout ── */
  #sTable { position: absolute; inset: 0; display: none; grid-template-columns: calc((300px + 40px) * var(--k)) 1fr; }
  #sTable.on { display: grid; }
  #lc { position: relative; margin: calc(40px * var(--k)) 0 calc(40px * var(--k)) calc(40px * var(--k)); display: flex; flex-direction: column; gap: calc(12px * var(--k));
    font-size: calc(16px * var(--k)); --bh: calc(52px * var(--k)); --bg: calc(8px * var(--k)); min-height: 0; }
  #lc > * { flex: none; }
  .tline { font-size: 1.9em; font-weight: 600; line-height: 1.05; color: var(--plum); }
  .tline.me { color: var(--terra); } .tline.bad { color: var(--red); } .tline.ok { color: var(--mintdk); }
  .tline.m { font-size: 1.5em; } .tline.s { font-size: 1.2em; }
  .mt { font-size: .8em; letter-spacing: .14em; color: #8a6a62; margin-top: .45em; }
  .crh { display: flex; justify-content: space-between; align-items: baseline; font-size: .82em; letter-spacing: .16em; color: #8E3A45; font-weight: 500; }
  .crh b { font-size: 2.5em; line-height: 1; color: var(--plum); font-weight: 600; letter-spacing: 0; }
  .dots { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .55em; }
  .dots i { width: .85em; height: .85em; border-radius: 50%; border: 2px solid #E08E43; background: var(--sun); }
  .dots i.x { background: none; border-color: var(--cb); }
  #acts .pr { font-size: .8em; letter-spacing: .14em; color: var(--rose); min-height: 2.5em; display: flex; align-items: flex-end; padding: 0 .3em .4em; line-height: 1.25; }
  #acts .btns { display: flex; flex-direction: column; gap: var(--bg); min-height: calc(5 * var(--bh) + 4 * var(--bg)); }
  #lc.over #acts .btns { min-height: 0; }
  /* swap step after a successful manipulate: big centred prompt in the space the five buttons normally take */
  #acts.swap { display: flex; flex-direction: column; min-height: calc(2em + 5 * var(--bh) + 4 * var(--bg)); }
  #acts.swap .btns { min-height: 0; }
  #acts.swap .pr { flex: 1 1 auto; align-items: center; justify-content: center; text-align: center; font-size: 1.35em; font-weight: 600; color: var(--sun); letter-spacing: .1em; padding: .4em .3em; line-height: 1.3; }
  .ea { pointer-events: auto; display: flex; align-items: center; gap: .7em; height: var(--bh); flex: none; padding: 0 .7em 0 .85em; border-radius: .85em; font-size: 1em; font-weight: 500; color: var(--plum); text-align: left; box-shadow: 0 .3em .8em rgba(0,0,0,.3); transition: transform .08s, filter .15s; }
  .ea:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
  .ea .fn, .ea .sn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ea .sn { display: none; }
  .ea i { margin-left: auto; min-width: 2.4em; height: 1.9em; padding: 0 .55em; border-radius: 999px; background: var(--plum); color: var(--cream); display: grid; place-items: center; font-style: normal; font-size: .88em; font-weight: 500; flex: none; }
  .ea.a1 { background: #A8DCCB; } .ea.a2 { background: #CDBBEA; } .ea.a3 { background: #F5D76E; } .ea.a4 { background: #F7A9BD; }
  .ea.nu { background: rgba(251,241,220,.1); color: var(--cream); border: 1px solid rgba(251,241,220,.4); box-shadow: none; }
  .ea:disabled { opacity: .36; filter: saturate(.6); }
  /* log card */
  #logCard { background: var(--cream); color: var(--plum); border-radius: 1.15em; box-shadow: 0 .5em 1.5em rgba(0,0,0,.38); padding: .6em .95em .7em; display: none; flex-direction: column; }
  #logCard.on { display: flex; flex: 1 1 auto; min-height: 5.5em; }   /* collapsed it still fills the column down to the bottom margin */
  #logCard .lh { display: flex; align-items: center; justify-content: space-between; height: 2em; font-size: .8em; letter-spacing: .18em; color: #8E3A45; font-weight: 600; flex: none; }
  #logCard .lh button { height: 2em; padding: 0 .9em; border-radius: 999px; border: 1px solid var(--cb); font-size: .95em; letter-spacing: .14em; color: var(--plum); font-weight: 500; }
  #logCard .lh button:hover { background: #efe1c4; }
  #logCard .back { margin: .2em 0 .4em; height: 2.6em; border-radius: .7em; background: var(--terra); color: #fff; font-size: .85em; letter-spacing: .12em; font-weight: 500; display: none; align-items: center; justify-content: center; flex: none; }
  #logCard.open.mine .back { display: flex; }
  #logCard .lb { font-size: .8em; line-height: 1.38; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #logCard .lb div { margin: 0 0 .22em; } #logCard .lb div.nr { border-top: 1.5px solid #bfa47c; padding-top: .3em; margin-top: .35em; } #logCard .lb span { color: #8E3A45; } #logCard .lb .rv { color: #6b4aa0; }
  #logCard .lb i { font-style: normal; color: #8a6a62; float: right; margin-left: .6em; }
  #logCard.open { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 8; }
    #lc.over #logCard.open { position: relative; inset: auto; flex: 1 1 auto; min-height: 0; z-index: 1; }

  /* ── table area ── */
  #tarea { position: relative; margin-right: calc(40px * var(--k)); min-width: 0; pointer-events: none; }
  #plates, #tarea > * { pointer-events: none; }
  .seat { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: var(--pf);
    min-height: 2.5em; padding: 0 1.1em; border-radius: 999px; background: #3d2238; color: var(--cream); border: 1px solid rgba(251,241,220,.3); font-weight: 500; letter-spacing: .08em; box-shadow: 0 .25em .8em rgba(0,0,0,.3); }
  .seat .r1 { display: flex; align-items: center; gap: .5em; line-height: 1.1; }
  .seat small { font-size: .62em; letter-spacing: .12em; opacity: .7; }
  .seat .r2 { display: none; font-size: .62em; letter-spacing: .14em; opacity: .85; line-height: 1.1; margin-top: .1em; }
  .seat.over .r2 { display: block; } .seat.over { padding-top: .2em; padding-bottom: .25em; }
  .seat.me { background: var(--cream); color: var(--plum); border-color: var(--cream); pointer-events: auto; cursor: pointer; }
  .seat.me:hover { filter: brightness(1.06); }
  .seat.off { opacity: .45; }
  .seat.hit { background: var(--red); border-color: var(--red); color: #fff; }
  .seat.chatw { box-shadow: 0 0 0 2px rgba(251,241,220,.75), 0 .25em .8em rgba(0,0,0,.3); }
  .seat.turn { background: var(--sun); color: var(--plum); border-color: var(--sun); z-index: 3; animation: turnp 1.1s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(242,168,103,.45), 0 0 28px 6px rgba(242,168,103,.75); }
  @keyframes turnp { 0%, 100% { transform: translate(-50%, -50%) scale(.9825); } 50% { transform: translate(-50%, -50%) scale(1.0175); } }
  .seat.shake { animation: shk .5s linear; }
  @keyframes shk { 0%, 100% { transform: translate(-50%, -50%); } 15% { transform: translate(calc(-50% - 7px), -50%); } 30% { transform: translate(calc(-50% + 7px), -50%); } 45% { transform: translate(calc(-50% - 5px), -50%); } 60% { transform: translate(calc(-50% + 5px), -50%); } 80% { transform: translate(calc(-50% - 2px), -50%); } }
  .seat .first { display: none; position: absolute; left: -.7em; top: -.85em; height: 1.4em; padding: 0 .55em; border-radius: 999px; background: var(--terra); color: #fff; font-size: .72em; font-weight: 600; letter-spacing: .12em; align-items: center; z-index: 4; }
  .seat .first.on { display: flex; }
  .seat .first.hop { animation: hop .9s ease both; }
  @keyframes hop { 0% { transform: translate(-90px, 40px) scale(.6); opacity: 0; } 60% { transform: translate(0, -8px) scale(1.5); opacity: 1; } 100% { transform: none; opacity: 1; } }
  .seat .hl { display: none; position: absolute; right: -.4em; top: -.8em; height: 1.3em; padding: 0 .5em; border-radius: 999px; background: var(--cream); color: var(--red); font-size: .66em; font-weight: 600; letter-spacing: .14em; align-items: center; }
  .seat.hit .hl { display: flex; }
  #tctl { position: absolute; right: 0; top: calc(26px * var(--k)); display: flex; gap: .6em; align-items: center; font-size: calc(14px * var(--k)); }
  .ctl { height: 2.5em; padding: 0 1.1em; border-radius: .55em; border: 1px solid rgba(255,255,255,.22); background: #57535C; color: #F1EDE7; font-size: 14px; letter-spacing: .12em; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 .2em .6em rgba(0,0,0,.3); }
  .ctl:hover { background: #6A6670; color: #fff; }
  #tctl .ctl { font-size: 1em; }
  #tabLog { display: none; position: absolute; left: 0; top: 6px; pointer-events: auto; }
  #rcard { position: absolute; transform: translate(-50%, -50%) scale(.8); z-index: 6; width: 22em; max-width: 96%; padding: 1.4em 1.2em; text-align: center; opacity: 0; font-size: var(--rf);
    background: var(--cream); color: var(--plum); border-radius: 1.6em; box-shadow: 0 18px 50px rgba(0,0,0,.6); }

<script>
"use strict";
// ═════════════════════════════ CONFIG ═════════════════════════════
const LOCAL_PORT = (new URLSearchParams(location.search).get('port') || '8787').replace(/\D/g, '') || '8787';   // ?port= for a local server on another port
const SERVER_URL = (location.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname))
  ? 'http://localhost:' + LOCAL_PORT
  : 'https://roulette-server.oceansdevon.workers.dev';
const WS_URL = SERVER_URL.replace(/^http/, 'ws');

const LET = 'ABCDEF';
const COL = { plum: '#2A1422', cream: '#FBF1DC', sun: '#F2A867', terra: '#C9482F', red: '#E5484D', mint: '#5FD3B0', mintDk: '#1F8F6F' };
// Action button kinds: CSS classes a1 (mint, open) a2 (lavender, private) a3 (sand, both rotates) a4 (rose, manipulate / swap).
const IC = {
  open: '<svg class="ico" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  priv: '<svg class="ico" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  rot1: '<svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>',
  rot2: '<svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/><path d="M10 10.5a2 2 0 013.6 1.2c0 1.3-3.6 2.3-3.6 3.8h3.8" stroke-width="1.5"/></svg>',
  swap: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  ok: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  no: '<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pass: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg>',
  again: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 018-8 8 8 0 016.5 3.3M20 12a8 8 0 01-8 8 8 8 0 01-6.5-3.3"/><path d="M19 3v5h-5M5 21v-5h5"/></svg>'
};

// ═════════════════════════════ STORAGE / IDENTITY ═════════════════════════════
const NS = (new URLSearchParams(location.search).get('p') || '').replace(/[^\w-]/g, '').slice(0, 20);
const K = k => 'rr:' + NS + ':' + k;
function lsGet(k) { try { return localStorage.getItem(K(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(K(k)); else localStorage.setItem(K(k), v); } catch (e) {} }
let token = lsGet('token');
if (!token) {
  const a = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256);
  token = Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); lsSet('token', token);
}
let savedRoom = lsGet('room'), savedName = (lsGet('name') || '').toUpperCase();

// ═════════════════════════════ AUDIO ═════════════════════════════
const sfxEls = {};
function sfx(name, vol) {
  try {
    if (!sfxEls[name]) sfxEls[name] = new Audio('audio/' + name + '.mp3');
    const a = sfxEls[name].cloneNode(); a.volume = vol == null ? 0.5 : vol;
    const p = a.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
let actx = null;
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function synth(kind) {   // 'click' quiet empty-chamber click, 'bang' loud shot
  try {
    ensureAudio(); if (!actx) return;
    const dur = kind === 'bang' ? 0.45 : 0.05, n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, kind === 'bang' ? 2.5 : 6);

    const f = actx.createBiquadFilter(); f.type = kind === 'bang' ? 'lowpass' : 'bandpass'; f.frequency.value = kind === 'bang' ? 900 : 2200;
    const g = actx.createGain(); g.gain.value = kind === 'bang' ? 0.7 : 0.12;
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
  } catch (e) {}
}

// ═════════════════════════════ GLOBAL STATE ═════════════════════════════
const $ = id => document.getElementById(id);
const cv = $('c'), c = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 0;
let screen = 'menu';        // menu | connecting | lobby | table
let G = null;               // latest server state
let ws = null;
const conn = { code: null, name: null, intentional: false, fatal: false, tries: 0, gotState: false, everState: false, reconnecting: false, timer: null };
let toastTimer = null;
let showHow = false;
let privQueue = [];
let lastSeq = 0, lastRot = 0;
let aimT = -Math.PI / 2, aimD = -Math.PI / 2;
let fire = null;
let fx = { flash: 0, shake: 0 };
let act = { mode: 'bar', kind: null, sel: [] };
let sending = false;
let soloPending = false;   // 'Play vs CPU': fill the room with CPUs as soon as we're in the lobby
let hoverCh = -1;
let logOpen = false;        // log card expanded (wide) / shown (compact)
let rc = null;              // round cue: { t0, round, prev } while the pill is still on the old seat
const ui = { mx: -1, my: -1, blocked: false };
const chatData = { left: [], right: [] };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const setText = (el, s) => { if (el._t !== s) { el._t = s; el.textContent = s; } };
const setHtml = (el, s) => { if (el._h !== s) { el._h = s; el.innerHTML = s; } };

// ═════════════════════════════ NETWORK ═════════════════════════════
function sendMsg(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  const el = $('toast'); el.textContent = t.toUpperCase(); el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 4500);
}

function connectRoom(code, name) {
  conn.code = code; conn.name = name; conn.intentional = false; conn.fatal = false; conn.tries = 0;
  conn.gotState = false; conn.everState = false; conn.reconnecting = false;
  savedRoom = code; lsSet('room', code); lsSet('name', name); savedName = name;
  screen = 'connecting'; openSocket();
}
function openSocket() {
  clearTimeout(conn.timer);
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }

  try { sock = new WebSocket(WS_URL + '/room/' + conn.code); } catch (e) { return handleClose(); }

}
function handleClose() {
  if (conn.intentional || conn.fatal) return;

  }
  conn.reconnecting = true; conn.gotState = false;

}
function toMenu(msg) {
  conn.intentional = true; clearTimeout(conn.timer);
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  conn.reconnecting = false; G = null; screen = 'menu'; fire = null; privQueue = []; showHow = false; rc = null;
  act = { mode: 'bar', kind: null, sel: [] }; chatData.left = []; chatData.right = []; renderChats(true);
  logOpen = false; resetTableView();
  if (msg) showToast(msg);
}
function leaveRoom() { savedRoom = null; lsSet('room', null); toMenu(); }

const FRIENDLY = { no_room: 'That room does not exist.', room_full: 'That room is full.', in_progress: 'That game has already started.',
  bad_action: 'That move is not allowed.', not_your_turn: 'It is not your turn.', not_host: 'Only the host can do that.' };

      if (!fire.aimed[j]) {
        fire.aimed[j] = true; fire.curChamber = f[j].chamber;
        const d = (f[j].seat - fire.cur + 6) % 6; aimT += d * Math.PI / 3; fire.cur = f[j].seat;
      }
      if (!fire.shot[j] && fire.t - T0 - j * STEP >= 500) {
        fire.shot[j] = true; fire.fired[f[j].chamber] = true;
        if (f[j].bullet) { fire.hit.add(f[j].seat); fx.flash = 1; fx.shake = 1; synth('bang'); } else synth('click');
      }
    }
    if (fire.t > T0 + 6 * STEP + 300) { fire.done = true; fire.curChamber = null; sfx('arcade4', 0.5); }
  }
}
// Only two bullets exist, so at most two chambers are drawn red. When more than two notes say 'bullet', the newest two win (by event seq) and
// older bullet notes are dropped as stale. If second place is a tie (two notes from one older event), neither tied note is shown.
function shownNotes(notes) {
  if (!notes) return null;
  const b = [0, 1, 2, 3, 4, 5].filter(i => notes[i] && notes[i].bullet).sort((x, y) => notes[y].seq - notes[x].seq);
  if (b.length <= 2) return notes;
  const keep = new Set(b.slice(0, 2));
  if (notes[b[1]].seq === notes[b[2]].seq) { keep.delete(b[1]); if (notes[b[0]].seq === notes[b[1]].seq) keep.delete(b[0]); }
  return notes.map((n, i) => (n && n.bullet && !keep.has(i) ? null : n));
}
function drawCanvas(t) {
  c.clearRect(0, 0, W, H);
  cv.style.cursor = 'default';
  if (screen !== 'table' || !G || G.phase === 'lobby' || !Ly.valid) return;
  const kind = pickKind();
  drawDisc();
  const sel = kind ? selectableSet(kind) : null;
  let reveal = null;
  if (G.phase === 'over' && G.result) {
    if (fire && !fire.done) reveal = G.result.bullets.map((b, i) => fire.fired[i] ? b : null);
    else reveal = G.result.bullets;
  }
  let selected = kind ? act.sel : [];
  if (fire && !fire.done && fire.curChamber != null) selected = [fire.curChamber];
  const da = dispAim();
  const hv = sel && !ui.blocked ? chamberAt(Ly.cx, Ly.cy, Ly.R, da, ui.mx, ui.my) : -1;
  hoverCh = hv; if (hv >= 0 && sel.has(hv)) cv.style.cursor = 'pointer';
  const glow = kind === 'swap' && act.sel.length < 2 ? new Set([...sel].filter(i => act.sel.indexOf(i) < 0)) : null;   // swap step: every pickable chamber pulses
  drawRevolver(c, Ly.cx, Ly.cy, Ly.R, da, { notes: shownNotes(G.notes), selectable: sel, selected, hover: hv, reveal, flash: fx.flash, t, glow });
}

function frame(ts) {
  const t = ts || now();
  const dt = Math.min(0.1, (t - (frame.last || t)) / 1000); frame.last = t;
  ui.blocked = modalActive();
  syncScreen();
  computeLayout();
  update(dt, t);
  if (screen === 'menu') renderMenu();
  else if (screen === 'connecting') renderConnecting();
  else if (screen === 'lobby' && G) renderLobby();
  else if (screen === 'table' && G) renderTable(t);
  renderModals();
  $('recon').classList.toggle('on', conn.reconnecting && screen !== 'menu');
  drawCanvas(t);
  requestAnimationFrame(frame);
}

// ═════════════════════════════ INPUT ═════════════════════════════
function resize() { sizeCanvas(); }
window.addEventListener('resize', resize);
cv.addEventListener('pointermove', e => { ui.mx = e.clientX; ui.my = e.clientY; });
cv.addEventListener('pointerleave', () => { ui.mx = ui.my = -1; });
window.addEventListener('pointerdown', ensureAudio);
cv.addEventListener('pointerdown', e => {
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  ui.mx = e.clientX; ui.my = e.clientY;
  if (!ui.blocked && screen === 'table' && G && Ly.valid && pickKind()) {
    const i = chamberAt(Ly.cx, Ly.cy, Ly.R, dispAim(), ui.mx, ui.my);
    if (i >= 0) clickChamber(i);
  }
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (showHow) showHow = false; else if (privQueue.length) privQueue.shift(); }
  if (e.key === 'Enter' && privQueue.length && document.activeElement === document.body) privQueue.shift();
});
// Every HTML button carries data-a; this table says what each one does.
const pick = k => () => { act = { mode: 'pick', kind: k, sel: [] }; };
const HANDLERS = {
  solo: doSolo, create: doCreate, join: doJoin, rejoin: doRejoin,
  how: () => { showHow = true; $('howBody').scrollTop = 0; }, howclose: () => { showHow = false; },
  privok: () => { privQueue.shift(); },
  cancel: () => leaveRoom(), leave: () => leaveRoom(),
  cpuadd: () => sendMsg({ t: 'cpu', op: 'add' }), cpufill: () => sendMsg({ t: 'cpu', op: 'fill' }),
  cpux: b => sendMsg({ t: 'cpu', op: 'remove', index: +b.dataset.i }),
  cplus: () => setCred(G.options.credits + 1), cminus: () => setCred(G.options.credits - 1),
  cnum: () => { const v = window.prompt('Starting credits (14 to 36)', String(G.options.credits)); if (v != null && v.trim() !== '') setCred(parseInt(v, 10)); },
  logopt: () => { G.options.log = !G.options.log; sendMsg({ t: 'options', credits: G.options.credits, log: G.options.log }); },
  open: pick('open'), private: pick('private'),
  rot1: () => doAction({ a: 'rotate', n: 1 }), rot2: () => doAction({ a: 'rotate', n: 2 }),
  manip: () => { act = { mode: 'manip', kind: null, sel: [] }; },
  confirm: confirmPick, pcancel: resetAct, mcancel: resetAct,
  m1: () => doAction({ a: 'manipulate', amount: 1 }), m2: () => doAction({ a: 'manipulate', amount: 2 }), m3: () => doAction({ a: 'manipulate', amount: 3 }),
  pass: () => doAction({ a: 'pass' }), again: () => sendMsg({ t: 'restart' }),
  logtog: () => { logOpen = !logOpen; logKey = ''; },
  logtab: () => { logOpen = !logOpen; logKey = ''; if (logOpen) { chats.left.set(false); chats.right.set(false); } }
};
$('app').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const h = HANDLERS[b.dataset.a]; if (!h) return;
  ensureAudio();
  if (!b.hasAttribute('data-ns')) sfx('keyclick', 0.125);
  h(b);
});

// ═════════════════════════════ CHAT (HTML) ═════════════════════════════
// Two tabs in the bottom corners of the table area. Opening one expands it upwards into a panel; layoutChats() limits its height
// so it stops just below any nameplate in its corner (and, on narrow screens, lets it open over the table).
const chats = {};
for (const side of ['left', 'right']) {
  const el = $(side === 'left' ? 'chatL' : 'chatR');
  const o = { el, side, name: el.querySelector('.cn'), un: el.querySelector('.un'), list: el.querySelector('.cm'), input: el.querySelector('.ci'), unread: 0, open: false, n: -1 };
  o.set = v => {
    o.open = v; el.classList.toggle('open', v);
    if (v) { o.unread = 0; updateUnread(o); setTimeout(() => { o.list.scrollTop = o.list.scrollHeight; o.input.focus(); }, 0); }
  };
  chats[side] = o;
  el.querySelector('.ch').addEventListener('click', () => {
    const v = !o.open;
    if (v && Ly.compact) { const other = chats[side === 'left' ? 'right' : 'left']; other.set(false); logOpen = false; logKey = ''; }
    o.set(v);
  });
  o.input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { const t = o.input.value.trim(); if (t) { sendMsg({ t: 'chat', side, text: t.slice(0, 300) }); o.input.value = ''; } }
  });
}
function updateUnread(o) { o.un.textContent = o.unread > 9 ? '9+' : String(o.unread); o.un.classList.toggle('has', o.unread > 0); }
function markUnread(side) { const o = chats[side]; if (!o.open) { o.unread++; updateUnread(o); } }
function renderChats(force) {
  for (const side of ['left', 'right']) {
    const o = chats[side], d = chatData[side];
    if (!force && o.n === d.length) continue; o.n = d.length;
    o.list.innerHTML = '';
    if (!d.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No messages yet.'; o.list.appendChild(e); }
    for (const m of d) { const div = document.createElement('div'); div.className = m.mine ? 'me' : 'them'; div.textContent = m.text; o.list.appendChild(div); }
    o.list.scrollTop = o.list.scrollHeight;
    if (force) { o.unread = 0; updateUnread(o); }
  }
}
function refreshChatTitles() {
  if (!G || !G.you || G.phase === 'lobby') return;
  const me = G.you.index;
  setText(chats.left.name, nm((me + 1) % 6)); setText(chats.right.name, nm((me + 5) % 6));
  for (const [side, s] of [['left', (me + 1) % 6], ['right', (me + 5) % 6]]) {   // no chat with a CPU (or an empty seat)
    const p = G.players[s], human = !!(p && !p.cpu), o = chats[side];
    o.el.classList.toggle('gone', !human); if (!human && o.open) o.set(false);
  }
}
function layoutChats() {
  $('tarea').classList.toggle('chatopen', chats.left.open || chats.right.open);
  const k = Ly.k, aw = Ly.aw, ah = Ly.ah, bottom = 16 * k;
  for (const side of ['left', 'right']) {
    const o = chats[side], el = o.el;
    if (!o.open) { if (el.style.height) { el.style.height = ''; el.style.width = ''; } continue; }
    const tabH = el.querySelector('.ch').offsetHeight || 46;
    let top;
    if (Ly.compact) {
      el.style.width = '';   // CSS makes the open panel span the full width
      top = ah * 0.26;
    } else {
      const w = Math.min(aw * 0.36, 280 * k), x0 = side === 'left' ? 12 * k : aw - 12 * k - w, x1 = x0 + w;
      el.style.width = w + 'px';
      top = 6;
      for (let i = 0; i < 6; i++) {   // stop below every nameplate that overlaps this corner horizontally
        if (!G.players[i] || !plates[i]) continue;
        const pos = seatPos(i), pw = plates[i].el.offsetWidth || Ly.pw, ph = plates[i].el.offsetHeight || Ly.ph;
        if (pos.x + pw / 2 > x0 - 4 && pos.x - pw / 2 < x1 + 4 && pos.y < ah - bottom - tabH) top = Math.max(top, pos.y + ph / 2 + 10);
      }
    }
    const h = Math.max(tabH + 90, ah - bottom - top);
    const hs = Math.round(h) + 'px'; if (el.style.height !== hs) el.style.height = hs;
  }
}

// ═════════════════════════════ BOOT ═════════════════════════════
sizeCanvas();
if (/[?&]nointro/.test(location.search)) document.body.classList.remove('intro'); else runIntro();   // ?nointro skips the start-up sequence (testing)
requestAnimationFrame(frame);
</script>
